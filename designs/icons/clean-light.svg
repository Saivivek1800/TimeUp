<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Off-White Background Gradient -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>

    <!-- Deep Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>

    <!-- Warm Amber Radiant Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F766E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Clean App Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgLight)"/>
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="#0F766E" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Logo Centerpiece -->
  <g transform="translate(256, 256)" filter="url(#iconShadow)">
    <!-- Outer Mindful Focus Orbit -->
    <circle r="150" fill="none" stroke="#CCFBF1" stroke-width="12" stroke-linecap="round"/>
    <circle r="150" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="480 600" stroke-dashoffset="120"/>

    <!-- Concentric Inner Circle -->
    <circle r="118" fill="url(#tealGrad)"/>

    <!-- Hourglass Outline in Pure White -->
    <path d="M -44 -56 L 44 -56 C 36 -18, 14 -8, 0 0 C -14 -8, -36 -18, -44 -56 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -44 56 L 44 56 C 36 18, 14 8, 0 0 C -14 8, -36 18, -44 56 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Horizontal Bars -->
    <line x1="-48" y1="-56" x2="48" y2="-56" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="-48" y1="56" x2="48" y2="56" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

    <!-- Center Pivot Dot -->
    <circle cx="0" cy="0" r="4.5" fill="#FBBF24"/>

    <!-- Reclaimed Time Amber Sand in Bottom -->
    <path d="M -30 48 C -22 28, -8 20, 0 16 C 8 20, 22 28, 30 48 Z" fill="url(#goldGrad)"/>

    <!-- Plant/Sprout of intentional growth -->
    <path d="M 0 28 C -4 20, -10 22, -8 16 C -5 16, -1 22, 0 28 Z" fill="#5EEAD4"/>
    <path d="M 0 28 C 4 20, 10 22, 8 16 C 5 16, 1 22, 0 28 Z" fill="#2DD4BF"/>

    <!-- Orbit amber indicator node -->
    <circle cx="106" cy="-106" r="8" fill="#F59E0B"/>
  </g>
</svg>